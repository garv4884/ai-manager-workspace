name: Build AI Manager Bridge (Windows exe)

# Push a tag like bridge-v1.0 (or run this workflow by hand) to get AIManagerBridge.exe,
# attached to the GitHub release for a tag and as a downloadable artifact.
on:
  workflow_dispatch:
  push:
    tags: ["bridge-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        working-directory: Bridge
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --clean --name AIManagerBridge --hidden-import bridge_app --hidden-import claude_setup --hidden-import aim aim_bridge.py
      - name: Smoke test (exe starts and answers a CLI command)
        working-directory: Bridge
        run: echo "{}" | .\dist\AIManagerBridge.exe hook
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: AIManagerBridge
          path: Bridge/dist/AIManagerBridge.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Bridge/dist/AIManagerBridge.exe
